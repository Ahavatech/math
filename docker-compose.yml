services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oau_maths
    ports:
      - "5432:5432"
    volumes:
      - oau-maths-db:/var/lib/postgresql/data

volumes:
  oau-maths-db:

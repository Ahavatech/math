# /etc/nginx/sites-available/oaumaths
#
# Written as a plain port 80 site on purpose. `certbot --nginx` then adds the
# HTTPS server block, the certificate paths and the redirect. Do not add a
# `listen 443` block by hand before certbot has run: nginx -t fails without
# a certificate.
#
# Proxies to the app on 127.0.0.1:3100 (the existing site uses 3000).

server {
    listen 80;
    listen [::]:80;
    server_name oaumaths.online www.oaumaths.online;

    # Matches the app's own 10 MB upload cap (Decision #57)
    client_max_body_size 12M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    location / {
        limit_req zone=oaumaths_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # Overwrite X-Forwarded-For with the real TCP source address. Do NOT
        # use $proxy_add_x_forwarded_for: clients can spoof it and dodge the
        # app's rate limiter. See deploy/nginx/nginx-rate-limit-note.md.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=oaumaths_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /search {
        limit_req zone=oaumaths_search burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Never serve dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}

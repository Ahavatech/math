# /etc/nginx/conf.d/oaumaths-zones.conf
# Rate limit zones for the OAU Mathematics site. conf.d is included inside the
# http block, so this needs no edit to nginx.conf. Names are prefixed so they
# cannot clash with zones the existing site may define.

limit_req_zone $binary_remote_addr zone=oaumaths_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=oaumaths_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=oaumaths_search:10m rate=2r/s;

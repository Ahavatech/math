# /etc/nginx/sites-available/maths-oau
#
# Nginx reverse proxy for the OAU Department of Mathematics website.
# Serves the Next.js standalone server on port 3000.
#
# Setup:
#   sudo ln -s /etc/nginx/sites-available/maths-oau /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d maths.oauife.edu.ng
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zones (applied before the proxy, in the http block —
# add these lines to /etc/nginx/nginx.conf inside the http {} block):
#
#   limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
#   limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
#   limit_req_zone $binary_remote_addr zone=search:10m rate=2r/s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name maths.oauife.edu.ng;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maths.oauife.edu.ng;

    # SSL — managed by Certbot (certbot --nginx will insert these)
    # ssl_certificate /etc/letsencrypt/live/maths.oauife.edu.ng/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/maths.oauife.edu.ng/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Max upload size — matches the app's own 10 MB cap (Decision #57)
    client_max_body_size 12M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # -----------------------------------------------------------------------
    # Rate limits per location
    # -----------------------------------------------------------------------

    # Public pages — generous limit
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Overwrite X-Forwarded-For with the real TCP source address.
        # Do NOT use $proxy_add_x_forwarded_for — clients can spoof that.
        # See deploy/nginx/nginx-rate-limit-note.md.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Host            $host;
        proxy_set_header Upgrade         $http_upgrade;
        proxy_set_header Connection      "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes — tighter limit
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Search — strictest limit (matches app-level rate limiter)
    location /search {
        limit_req zone=search burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets — long cache, no rate limit
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to .env, .git, private storage
    location ~ /\. {
        deny all;
        return 404;
    }
}
